name: release
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
jobs:
  release:
    permissions:
      contents: write
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      # Pinned: the stdkups shard releases pin the same version, and the
      # loader rejects shards built with another Nim version.
      nim-version: '2.4.0'
      app-name: dfkup
      target-matrix: '[{"os":"ubuntu-latest","arch":"x86_64"},{"os":"ubuntu-24.04-arm","arch":"arm64"},{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"},{"os":"windows-latest","arch":"x86_64"},{"os":"windows-11-arm","arch":"arm64"}]'
      # Shards are NOT built here: they come prebuilt from the stdkups
      # (github.com/dfkup/stdlib) release for this exact target, which
      # ships one `stdlib_<os>-<arch>.tar.gz` per target holding a
      # `libraries/` dir. The archive below keeps that dir next to the
      # binary; install = move it to `~/.dfkup/libraries`
      # (`DFKUP_HOME` overrides the home). Both releases pin Nim 2.4.0,
      # which the loader requires (it rejects shards built with another
      # Nim version). No tag = latest stdkups release; add one to
      # `gh release download` for reproducible rebuilds.
      pre-build-command: |
        suffix="$(echo "${RUNNER_OS}-${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
        GH_TOKEN="${{ github.token }}" gh release download \
          --repo github.com/dfkup/stdlib \
          --pattern "stdlib_${suffix}.tar.gz" --dir /tmp/stdlib
        mkdir -p "$GITHUB_WORKSPACE/libraries"
        tar xzf "/tmp/stdlib/stdlib_${suffix}.tar.gz" -C /tmp/stdlib
        cp /tmp/stdlib/libraries/* "$GITHUB_WORKSPACE/libraries/"
      extra-files: 'LICENSE README.md libraries'
