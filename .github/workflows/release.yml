name: release
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
jobs:
  release:
    permissions:
      contents: write
    uses: nimbase/setup-nim-action/.github/workflows/release_clue.yml@main
    with:
      nim-version: stable
      app-name: dfkup
      target-matrix: '[{"os":"ubuntu-latest","arch":"x86_64"},{"os":"ubuntu-24.04-arm","arch":"arm64"},{"os":"macos-14","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"},{"os":"windows-latest","arch":"x86_64"},{"os":"windows-11-arm","arch":"arm64"}]'
      # Shards are built at workflow level (no nimble task): clone the
      # stdlib repo as plain sources (dfkup has no `requires "stdkups"`)
      # and build every shard for this target. `clue install --depsOnly`
      # inside the clone resolves the shard dependencies; the reusable's
      # earlier `clue install` only sees dfkup's own deps. `extra-files`
      # flattens the shards next to the binary; the loader probes the
      # binary's own dir.
      pre-build-command: |
        git clone --depth 1 https://github.com/dfkup/stdlib.git /tmp/stdkups
        cd /tmp/stdkups && clue install --depsOnly
        clue build /tmp/stdkups/tools/build_shards.nim -o /tmp/build_shards &&
        /tmp/build_shards --stdkups=/tmp/stdkups --dfkup-src="$GITHUB_WORKSPACE" --out="$GITHUB_WORKSPACE/bin/stdlib"
      extra-files: 'LICENSE README.md bin/stdlib/*'
