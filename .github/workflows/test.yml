name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      os: '[{"os":"ubuntu-latest"},{"os":"macos-latest"}]'
      # The stdkups shards live in a separate repo (github.com/dfkup/stdlib),
      # used here as plain sources, not as a package: dfkup has no
      # `requires "stdkups"`. Clone it and resolve its dependencies so the
      # shard builder finds every (transitive) dep in the clue store.
      # Every shard is then built before `clue test` because the
      # config/runtime tests execute scripts through `src/dfkup.exec`,
      # which loads dylibs.
      pre-install-command: |
        git clone --depth 1 https://github.com/dfkup/stdlib.git /tmp/stdkups
        cd /tmp/stdkups && clue install --depsOnly
      pre-test-command: |
        clue build --hints:off --verbosity:0 /tmp/stdkups/tools/build_shards.nim --stdkups=/tmp/stdkups --dfkup-src="$GITHUB_WORKSPACE" --out="$GITHUB_WORKSPACE/bin/stdlib" &&
        $GITHUB_WORKSPACE/bin/stdlib
